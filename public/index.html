<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke N Chill — Deals & Wallet Passes</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --warning: #facc15;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 25px 20px 10px 20px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 8px 0;
      color: #ffffff;
    }

    .header-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .location-tag {
      display: inline-block;
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .age-notice {
      display: inline-block;
      background-color: rgba(250, 204, 21, 0.15);
      color: var(--warning);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    p.subtitle {
      margin: 12px 0 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 15px 15px 30px 15px;
      box-sizing: border-box;
    }

    .promo-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .promo-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .promo-discount {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 15px;
    }

    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .wallet-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0d12;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid var(--border-color, #2a2e3d);
      transition: background 0.2s, transform 0.2s ease;
    }

    .wallet-btn:hover {
      background-color: #181b24;
      border-color: #22c55e;
      transform: translateY(-2px);
    }

    .cooldown-badge {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 10px;
      display: none;
    }

    .locked .qr-container,
    .locked .wallet-btn {
      display: none;
    }

    .locked .cooldown-badge {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Smoke N Chill</h1>
    <div class="header-badges">
      <div id="location-banner" class="location-tag">Detecting Store Location...</div>
      <div class="age-notice">🔞 Must be 21+ with valid ID</div>
    </div>
    <p class="subtitle">Show QR code to cashier or add to your Google Wallet</p>
  </header>

  <div class="container" id="promotions-list">
    <p style="text-align: center; color: var(--muted);">Loading location-specific deals...</p>
  </div>

  <script>
    const socket = io();

    // Store Coordinates (Austin, TX)
    const STORES = {
      research: { name: "Smoke N Chill #3 (Research Blvd)", lat: 30.4182, lon: -97.7475 },
      parmer: { name: "Smoke N Chill #6 (Parmer Ln)", lat: 30.3992, lon: -97.6621 }
    };

    // 1. Persistent Customer Identification
    let customerId = localStorage.getItem('snc_customer_id');
    if (!customerId) {
      customerId = 'cust_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('snc_customer_id', customerId);
    }

    // 2. Check for explicit URL parameter (e.g. index.html?store=parmer)
    function getSelectedStore() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeParam = urlParams.get('store');
      if (storeParam && (storeParam.toLowerCase() === 'parmer' || storeParam.toLowerCase() === 'research')) {
        return storeParam.toLowerCase();
      }
      return null;
    }

    let activeStoreKey = getSelectedStore() || 'research';

    // 3. Haversine Distance Formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 3958.8; // Miles
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 4. Geolocation Detection
    if (navigator.geolocation && !getSelectedStore()) {
      navigator.geolocation.getCurrentPosition((pos) => {
        const userLat = pos.coords.latitude;
        const userLon = pos.coords.longitude;

        const distResearch = calculateDistance(userLat, userLon, STORES.research.lat, STORES.research.lon);
        const distParmer = calculateDistance(userLat, userLon, STORES.parmer.lat, STORES.parmer.lon);

        activeStoreKey = distParmer < distResearch ? 'parmer' : 'research';
        updateLocationHeader();
        loadPromotions();
      }, () => {
        updateLocationHeader();
        loadPromotions();
      });
    } else {
      updateLocationHeader();
      loadPromotions();
    }

    function updateLocationHeader() {
      const banner = document.getElementById('location-banner');
      banner.textContent = `📍 ${STORES[activeStoreKey].name}`;
    }

    // 5. Fetch and Filter Promotions
    async function loadPromotions() {
      const container = document.getElementById('promotions-list');

      try {
        const res = await fetch('/api/promotions/all');
        const data = await res.json();

        if (!data.success || !data.promotions || data.promotions.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: var(--muted);">No active promotions available today.</p>';
          return;
        }

        const locationPromos = data.promotions.filter(p => {
          if (!p.is_active) return false;
          if (!p.location) return true;
          const loc = p.location.toLowerCase();
          return loc === activeStoreKey || loc === 'all';
        });

        if (locationPromos.length === 0) {
          container.innerHTML = `<p style="text-align:center; color: var(--muted);">No specific deals active for ${STORES[activeStoreKey].name} today.</p>`;
          return;
        }

        container.innerHTML = '';

        for (const promo of locationPromos) {
          const statusRes = await fetch(`/api/coupon-status?code=${encodeURIComponent(promo.code)}&customerId=${encodeURIComponent(customerId)}`);
          const statusData = await statusRes.json();

          const card = document.createElement('div');
          card.className = `promo-card ${statusData.redeemed ? 'locked' : ''}`;
          card.id = `card-${promo.code}`;

          const qrCanvasId = `qr-${promo.code}`;
          const walletUrl = `/api/wallet/google/${encodeURIComponent(promo.code)}?customerId=${encodeURIComponent(customerId)}`;

          card.innerHTML = `
            <div class="promo-title">${escapeHtml(promo.title)}</div>
            <div class="promo-discount">${escapeHtml(promo.discount_text)}</div>
            
            <div class="qr-container">
              <canvas id="${qrCanvasId}"></canvas>
            </div>

            <a href="${walletUrl}" class="wallet-btn" target="_blank">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#22c55e" style="margin-right: 8px;">
                <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
              </svg>
              Add to Google Wallet
            </a>

            <div class="cooldown-badge" id="cooldown-${promo.code}">
              🔒 Redeemed today. Unlocks in 24 hours.
            </div>
          `;

          container.appendChild(card);

          if (!statusData.redeemed) {
            setTimeout(() => {
              const qrValue = `${promo.code}:${customerId}`;
              QRCode.toCanvas(document.getElementById(qrCanvasId), qrValue, { width: 180, margin: 1 });
            }, 50);
          }
        }
      } catch (err) {
        console.error('Failed to load deals:', err);
        container.innerHTML = '<p style="text-align:center; color: var(--danger);">Failed to load promotions. Please try again later.</p>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    socket.on('couponRedeemed', (data) => {
      if (data.customerId.toLowerCase() === customerId.toLowerCase()) {
        const card = document.getElementById(`card-${data.couponCode}`);
        if (card) {
          card.classList.add('locked');
        }
      }
    });

    socket.on('promoStateUpdated', () => {
      loadPromotions();
    });
  </script>
</body>
</html>
