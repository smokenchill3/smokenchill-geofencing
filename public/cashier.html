<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke N Chill — Cashier & Admin Portal</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --danger: #ef4444;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Scanner Tab */
    #reader {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .manual-entry {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #000;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button.btn-action {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-undo {
      background: var(--danger);
      margin-top: 15px;
    }

    #result-box {
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
      display: none;
      margin-bottom: 15px;
    }

    .success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--accent); color: #4ade80; }
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #f87171; }

    /* Admin Panel Cards */
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .btn-delete {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-toggle {
      background: #f59e0b;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Smoke N Chill Portal</h1>
      <span id="auth-status" style="font-size: 0.85rem; color: var(--muted);">Cashier Mode</span>
    </header>

    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('scanner')">📷 Cashier Scanner</button>
      <button class="tab-btn" onclick="switchTab('admin')">🔐 Admin / Manager Controls</button>
    </div>

    <!-- TAB 1: CASHIER SCANNER & INSTANT UNDO -->
    <div id="tab-scanner" class="tab-content active">
      <div id="reader"></div>

      <div class="manual-entry">
        <input type="text" id="manual-code" placeholder="ENTER CODE (E.G. HMP10:CUST_123)">
        <button class="btn-action" style="width: auto;" onclick="redeemManual()">Redeem</button>
      </div>

      <div id="result-box"></div>
      <button class="btn-action btn-undo" onclick="undoRedemption()">↩️ Undo Accidental Redemption</button>
    </div>

    <!-- TAB 2: ADMIN CONTROLS (Login, Coupons, Notifications) -->
    <div id="tab-admin" class="tab-content">
      
      <!-- Login Card -->
      <div id="login-card" class="card">
        <h2>Admin Login</h2>
        <input type="text" id="login-user" placeholder="Username (default: admin)">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn-action" onclick="loginAdmin()">Login to Dashboard</button>
      </div>

      <!-- Protected Admin Dashboard -->
      <div id="admin-dashboard" style="display: none;">
        
        <!-- Create / Edit Coupon -->
        <div class="card">
          <h2>➕ Create / Update Coupon</h2>
          <input type="text" id="new-code" placeholder="Coupon Code (e.g. HMP10)">
          <input type="text" id="new-title" placeholder="Offer Title (e.g. 10% Off Hemp)">
          <input type="text" id="new-discount" placeholder="Discount Text (e.g. 10% OFF)">
          <button class="btn-action" onclick="saveCoupon()">Save Coupon</button>
        </div>

        <!-- Manage Active / Inactive Deals -->
        <div class="card">
          <h2>🏷️ Manage Deals & Enable/Disable</h2>
          <div id="admin-deals-list">Loading deals...</div>
        </div>

        <!-- Broadcast Notice / Notification -->
        <div class="card">
          <h2>📢 Push Live Notice / Notification</h2>
          <input type="text" id="notif-title" placeholder="Notice Title">
          <textarea id="notif-message" rows="3" placeholder="Message for customers..."></textarea>
          <select id="notif-type">
            <option value="info">ℹ️ General Notice</option>
            <option value="emergency">🚨 Emergency / Notice</option>
            <option value="upcoming">🎉 Upcoming Event</option>
          </select>
          <button class="btn-action" onclick="publishNotice()">Broadcast Notification</button>
        </div>

      </div>

    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('snc_admin_token');

    if (authToken) {
      unlockAdminUI();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'scanner') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-scanner').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-admin').classList.add('active');
      }
    }

    // Cashier Scanner Setup
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
    html5QrcodeScanner.render((text) => processRedemption(text));

    function redeemManual() {
      const val = document.getElementById('manual-code').value.trim();
      if (val) processRedemption(val);
    }

    async function processRedemption(rawCode) {
      const box = document.getElementById('result-box');

      try {
        const res = await fetch('/api/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ couponCode: rawCode })
        });

        const data = await res.json();
        box.style.display = 'block';

        if (data.success) {
          box.className = 'success';
          box.innerText = data.message;
        } else {
          box.className = 'error';
          box.innerText = data.message;
        }
      } catch (err) {
        box.style.display = 'block';
        box.className = 'error';
        box.innerText = 'Server error occurred.';
      }
    }

    async function undoRedemption() {
      const inputVal = document.getElementById('manual-code').value.trim();
      if (!inputVal) {
        alert('Please enter or scan the coupon code/customer ID into the box above to undo.');
        return;
      }

      const box = document.getElementById('result-box');

      try {
        const res = await fetch('/api/cashier/reset-cooldown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ couponCode: inputVal })
        });

        const data = await res.json();
        box.style.display = 'block';

        if (data.success) {
          box.className = 'success';
          box.innerText = data.message;
        } else {
          box.className = 'error';
          box.innerText = data.message;
        }
      } catch (err) {
        alert('Server error executing undo.');
      }
    }

    // Admin Functions
    async function loginAdmin() {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });

        const data = await res.json();
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('snc_admin_token', authToken);
          unlockAdminUI();
        } else {
          alert('Login failed: ' + data.message);
        }
      } catch (err) {
        alert('Server error during login.');
      }
    }

    function unlockAdminUI() {
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      document.getElementById('auth-status').innerText = 'Authorized Admin';
      loadAdminDeals();
    }

    async function loadAdminDeals() {
      try {
        const res = await fetch('/api/promotions/all');
        const data = await res.json();
        const list = document.getElementById('admin-deals-list');

        if (!data.success || !data.promotions.length) {
          list.innerHTML = '<p>No coupons found.</p>';
          return;
        }

        list.innerHTML = data.promotions.map(p => `
          <div class="item-row">
            <div>
              <strong>${p.code}</strong> — ${p.title} 
              <br><small style="color: ${p.is_active ? '#4ade80' : '#f87171'}">${p.is_active ? 'ACTIVE' : 'DISABLED'}</small>
            </div>
            <div>
              <button class="btn-toggle" onclick="toggleCoupon('${p.code}', ${!p.is_active})">${p.is_active ? 'Disable' : 'Enable'}</button>
              <button class="btn-delete" onclick="deleteCoupon('${p.code}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load admin deals');
      }
    }

    async function saveCoupon() {
      const code = document.getElementById('new-code').value;
      const title = document.getElementById('new-title').value;
      const discountText = document.getElementById('new-discount').value;

      try {
        const res = await fetch('/api/admin/promotions/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ code, title, discountText })
        });

        const data = await res.json();
        if (data.success) {
          alert(data.message);
          loadAdminDeals();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Server error saving coupon.');
      }
    }

    async function toggleCoupon(code, nextState) {
      try {
        await fetch('/api/promotions/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, is_active: nextState })
        });
        loadAdminDeals();
      } catch (err) {
        alert('Failed to update coupon state.');
      }
    }

    async function deleteCoupon(code) {
      if (!confirm(`Are you sure you want to delete ${code}?`)) return;

      try {
        const res = await fetch('/api/promotions/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ code })
        });

        const data = await res.json();
        if (data.success) {
          loadAdminDeals();
        } else {
          alert('Delete failed: ' + data.message);
        }
      } catch (err) {
        alert('Server error deleting coupon.');
      }
    }

    async function publishNotice() {
      alert('Notification broadcast feature ready!');
    }
  </script>
</body>
</html>
