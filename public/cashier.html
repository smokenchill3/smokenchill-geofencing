<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke N Chill — Cashier & Admin Portal</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --danger: #ef4444;
      --primary: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--accent);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .manual-entry {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #000;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button.btn-action {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    .btn-danger { background: var(--danger); }
    .btn-warning { background: #f59e0b; color: #000; }

    #result-box {
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
      display: none;
      margin-bottom: 15px;
    }

    .success { background: rgba(34, 197, 94, 0.2); border: 1px solid var(--accent); color: #4ade80; }
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #f87171; }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    #admin-auth-section {
      border: 2px dashed var(--primary);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Smoke N Chill — Cashier & Admin Portal</h1>

    <!-- 1. CASHIER SCANNER -->
    <div class="card">
      <h2>📷 Cashier Scanner & Redemption</h2>
      <div id="reader"></div>

      <div class="manual-entry">
        <input type="text" id="manual-code" placeholder="ENTER CODE (E.G. HMP10:CUST_123)">
        <button class="btn-action" style="width: auto;" onclick="redeemManual()">Redeem</button>
      </div>

      <div id="result-box"></div>
      <button class="btn-action btn-danger" onclick="undoRedemption()">↩️ Undo Accidental Redemption</button>
    </div>

    <!-- 2. ADMIN LOGIN -->
    <div class="card" id="login-card">
      <h2>🔐 Admin Login</h2>
      <input type="text" id="login-user" placeholder="Username (default: admin)">
      <input type="password" id="login-pass" placeholder="Password">
      <button class="btn-action" onclick="loginAdmin()">Login to Admin Portal</button>
    </div>

    <!-- 3. ADMIN AUTHORIZATION / MANAGER CONTROLS (BOTTOM) -->
    <div class="card" id="admin-auth-section" style="display: none;">
      <h2 style="color: var(--primary);">🛡️ Admin Authorization & Management Panel</h2>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 15px;">Authorized Admin Mode</p>

      <div style="margin-bottom: 20px;">
        <h3 style="font-size: 1rem; color: #fff;">🏷️ Enable / Disable & Manage Coupons</h3>
        <div id="admin-deals-list">Loading deals...</div>
      </div>

      <div style="margin-bottom: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3 style="font-size: 1rem; color: #fff;">➕ Add New Coupon / Deal</h3>
        <input type="text" id="new-code" placeholder="Coupon Code (e.g. HMP10)">
        <input type="text" id="new-title" placeholder="Offer Title (e.g. 10% Off)">
        <input type="text" id="new-discount" placeholder="Discount Banner Text (e.g. 10% OFF)">
        <button class="btn-action" onclick="saveCoupon()">Save & Publish Coupon</button>
      </div>

      <div style="margin-bottom: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3 style="font-size: 1rem; color: #fff;">📢 Push Notifications & Upcoming Features</h3>
        <input type="text" id="notif-title" placeholder="Notice / Event Title">
        <textarea id="notif-message" rows="3" placeholder="Message details for customers..."></textarea>
        <select id="notif-type">
          <option value="info">ℹ️ General Notice</option>
          <option value="emergency">🚨 Emergency / Closure</option>
          <option value="upcoming">🎉 Upcoming Feature / Deal</option>
        </select>
        <button class="btn-action" onclick="publishNotice()">Broadcast Notification</button>
      </div>

      <div style="padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
        <h3 style="font-size: 1rem; color: #fff;">👤 Add Manager Account</h3>
        <input type="text" id="mgr-user" placeholder="New Manager Username">
        <input type="password" id="mgr-pass" placeholder="New Manager Password">
        <button class="btn-action btn-warning" onclick="addManager()">Create Manager Account</button>
      </div>

    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('snc_admin_token');

    if (authToken) {
      unlockAdminUI();
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
    html5QrcodeScanner.render((text) => processRedemption(text));

    function redeemManual() {
      const val = document.getElementById('manual-code').value.trim();
      if (val) processRedemption(val);
    }

    async function processRedemption(rawCode) {
      const box = document.getElementById('result-box');

      try {
        const res = await fetch('/api/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ couponCode: rawCode })
        });

        const data = await res.json();
        box.style.display = 'block';

        if (data.success) {
          box.className = 'success';
          box.innerText = data.message;
        } else {
          box.className = 'error';
          box.innerText = data.message;
        }
      } catch (err) {
        box.style.display = 'block';
        box.className = 'error';
        box.innerText = 'Server error occurred.';
      }
    }

    async function undoRedemption() {
      const inputVal = document.getElementById('manual-code').value.trim();
      if (!inputVal) {
        alert('Please enter or scan the code into the input box above to undo.');
        return;
      }

      const box = document.getElementById('result-box');

      try {
        const res = await fetch('/api/cashier/reset-cooldown', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ couponCode: inputVal })
        });

        const data = await res.json();
        box.style.display = 'block';

        if (data.success) {
          box.className = 'success';
          box.innerText = data.message;
        } else {
          box.className = 'error';
          box.innerText = data.message;
        }
      } catch (err) {
        alert('Server error executing undo.');
      }
    }

    async function loginAdmin() {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });

        const data = await res.json();
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('snc_admin_token', authToken);
          unlockAdminUI();
        } else {
          alert('Login failed: ' + data.message);
        }
      } catch (err) {
        alert('Server error during login.');
      }
    }

    function unlockAdminUI() {
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('admin-auth-section').style.display = 'block';
      loadAdminDeals();
    }

    async function loadAdminDeals() {
      try {
        const res = await fetch('/api/promotions/all');
        const data = await res.json();
        const list = document.getElementById('admin-deals-list');

        if (!data.success || !data.promotions.length) {
          list.innerHTML = '<p>No coupons found.</p>';
          return;
        }

        list.innerHTML = data.promotions.map(p => `
          <div class="item-row">
            <div>
              <strong>${p.code}</strong> — ${p.title} 
              <br><small style="color: ${p.is_active ? '#4ade80' : '#f87171'}">${p.is_active ? 'ACTIVE' : 'DISABLED'}</small>
            </div>
            <div>
              <button class="btn-action btn-warning" style="padding: 6px 12px; font-size: 0.85rem; width: auto;" onclick="toggleCoupon('${p.code}', ${!p.is_active})">${p.is_active ? 'Disable' : 'Enable'}</button>
              <button class="btn-action btn-danger" style="padding: 6px 12px; font-size: 0.85rem; width: auto;" onclick="deleteCoupon('${p.code}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load admin deals');
      }
    }

    async function saveCoupon() {
      const code = document.getElementById('new-code').value;
      const title = document.getElementById('new-title').value;
      const discountText = document.getElementById('new-discount').value;

      try {
        const res = await fetch('/api/admin/promotions/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ code, title, discountText })
        });

        const data = await res.json();
        if (data.success) {
          alert(data.message);
          loadAdminDeals();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Server error saving coupon.');
      }
    }

    async function toggleCoupon(code, nextState) {
      try {
        await fetch('/api/promotions/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, is_active: nextState })
        });
        loadAdminDeals();
      } catch (err) {
        alert('Failed to update coupon state.');
      }
    }

    async function deleteCoupon(code) {
      if (!confirm(`Are you sure you want to delete ${code}?`)) return;

      try {
        const res = await fetch('/api/promotions/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ code })
        });

        const data = await res.json();
        if (data.success) {
          loadAdminDeals();
        } else {
          alert('Delete failed: ' + data.message);
        }
      } catch (err) {
        alert('Server error deleting coupon.');
      }
    }

    async function publishNotice() {
      alert('Notification broadcast feature ready!');
    }

    async function addManager() {
      alert('Manager account creation ready!');
    }
  </script>
</body>
</html>
