<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke N Chill — Deals & Wallet Passes</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }

    header img {
      max-width: 180px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 5px 0;
      color: #ffffff;
    }

    p.subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 0 15px 30px 15px;
      box-sizing: border-box;
    }

    .promo-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .promo-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .promo-discount {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 15px;
    }

    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .wallet-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .wallet-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .wallet-btn img {
      height: 44px;
      width: auto;
      display: block;
    }

    .cooldown-badge {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 10px;
      display: none;
    }

    .locked .qr-container,
    .locked .wallet-btn {
      display: none;
    }

    .locked .cooldown-badge {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <img src="/Snc3-logo.png" alt="Smoke N Chill Logo" onerror="this.style.display='none'">
    <h1>Smoke N Chill — Daily Deals</h1>
    <p class="subtitle">Show QR code to cashier or add to your Google Wallet</p>
  </header>

  <div class="container" id="promotions-list">
    <p style="text-align: center; color: var(--muted);">Loading active deals...</p>
  </div>

  <script>
    const socket = io();

    // 1. Persistent Customer Identification
    let customerId = localStorage.getItem('snc_customer_id');
    if (!customerId) {
      customerId = 'cust_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem('snc_customer_id', customerId);
    }

    // 2. Fetch and Render Promotions
    async function loadPromotions() {
      const container = document.getElementById('promotions-list');

      try {
        const res = await fetch('/api/promotions/all');
        const data = await res.json();

        if (!data.success || !data.promotions || data.promotions.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: var(--muted);">No active promotions available today.</p>';
          return;
        }

        const activePromos = data.promotions.filter(p => p.is_active);
        container.innerHTML = '';

        for (const promo of activePromos) {
          // Check 24-hour redemption status for this specific customer
          const statusRes = await fetch(`/api/coupon-status?code=${encodeURIComponent(promo.code)}&customerId=${encodeURIComponent(customerId)}`);
          const statusData = await statusRes.json();

          const card = document.createElement('div');
          card.className = `promo-card ${statusData.redeemed ? 'locked' : ''}`;
          card.id = `card-${promo.code}`;

          const qrCanvasId = `qr-${promo.code}`;
          const walletUrl = `/api/wallet/google/${encodeURIComponent(promo.code)}?customerId=${encodeURIComponent(customerId)}`;

          card.innerHTML = `
            <div class="promo-title">${escapeHtml(promo.title)}</div>
            <div class="promo-discount">${escapeHtml(promo.discount_text)}</div>
            
            <div class="qr-container">
              <canvas id="${qrCanvasId}"></canvas>
            </div>

            <a href="${walletUrl}" class="wallet-btn" target="_blank">
              <img src="https://developers.google.com/pay/passes/images/en_us_add_to_google_wallet.svg" alt="Add to Google Wallet">
            </a>

            <div class="cooldown-badge" id="cooldown-${promo.code}">
              🔒 Redeemed today. Unlocks in 24 hours.
            </div>
          `;

          container.appendChild(card);

          // Generate QR Code containing Code + Customer ID
          if (!statusData.redeemed) {
            setTimeout(() => {
              const qrValue = `${promo.code}:${customerId}`;
              QRCode.toCanvas(document.getElementById(qrCanvasId), qrValue, { width: 180, margin: 1 });
            }, 50);
          }
        }
      } catch (err) {
        console.error('Failed to load deals:', err);
        container.innerHTML = '<p style="text-align:center; color: var(--danger);">Failed to load promotions. Please try again later.</p>';
      }
    }

    // Utility: HTML Escaping
    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 3. Real-time updates via Socket.io
    socket.on('couponRedeemed', (data) => {
      if (data.customerId.toLowerCase() === customerId.toLowerCase()) {
        const card = document.getElementById(`card-${data.couponCode}`);
        if (card) {
          card.classList.add('locked');
        }
      }
    });

    socket.on('promoStateUpdated', () => {
      loadPromotions();
    });

    // Initial load
    loadPromotions();
  </script>
</body>
</html>
