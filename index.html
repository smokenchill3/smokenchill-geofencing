<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoke N Chill - Exclusive In-Store Deals</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #00ff87;
      --accent: #60efff;
      --dark-bg: #0b0b10;
      --card-bg: #161622;
      --text: #ffffff;
      --danger: #ff4757;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 10%, rgba(0, 255, 135, 0.15), transparent 60%);
    }

    /* 21+ Modal Overlay */
    #ageModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 340px;
      box-shadow: 0 0 30px rgba(0, 255, 135, 0.3);
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:active { transform: scale(0.96); }

    .header-logo {
      width: 120px;
      margin-top: 25px;
      filter: drop-shadow(0 0 10px rgba(0,255,135,0.4));
    }

    .container {
      width: 90%;
      max-width: 450px;
      margin: 20px auto;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 20px;
      background: #222;
    }

    .promo-card {
      background: var(--card-bg);
      border: 1px solid #2a2a3c;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      text-align: left;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .promo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--primary);
    }

    .discount-tag {
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0 0 4px 0;
    }

    .promo-title {
      font-size: 1.05rem;
      margin: 0 0 10px 0;
      color: #ddd;
    }

    .exp-date {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 15px;
    }

    .btn-wallet {
      display: inline-block;
      text-decoration: none;
      background: #000;
      color: #fff;
      border: 1px solid var(--primary);
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
    }

    .disabled-card {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Age Verification Modal -->
  <div id="ageModal">
    <div class="modal-box">
      <img src="Snc3-logo.png" style="width: 80px;" alt="Smoke N Chill @ Research" />
      <h2>Age Verification</h2>
      <p style="color: #aaa; font-size: 0.9rem;">You must be 21 years or older to access Smoke N Chill @ Research in-store promotions.</p>
      <button class="btn" onclick="verifyAge()">I AM 21 OR OLDER</button>
    </div>
  </div>

  <img class="header-logo" src="Snc3-logo.png" alt="Smoke N Chill @Research" />
  <h2>SMOKE N CHILL @ Research</h2>
  <div id="statusBadge" class="status-badge">Checking Geofence Location...</div>

  <div class="container" id="promosContainer">
    <!-- Dynamic Promo Cards Render Here -->
  </div>

  <script>
    const socket = io();
    let userVerified = false;

    function verifyAge() {
      userVerified = true;
      document.getElementById('ageModal').style.display = 'none';
      requestLocation();
    }

    function requestLocation() {
      if (!userVerified) return;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            socket.emit('checkLocation', {
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude
            });
          },
          (err) => {
            document.getElementById('statusBadge').innerText = 'GPS Required for Offers';
            document.getElementById('statusBadge').style.color = '#ff4757';
          }
        );
      }
    }

    socket.on('locationResult', (data) => {
      const badge = document.getElementById('statusBadge');
      const container = document.getElementById('promosContainer');

      if (!data.inside) {
        badge.innerText = `Out of Range (${data.distanceMiles} miles away)`;
        badge.style.color = '#ff4757';
        container.innerHTML = '<p style="color: #888;">Visit Smoke N Chill store location to unlock instant QR coupons!</p>';
        return;
      }

      badge.innerText = 'Unlocked In-Store Deals!';
      badge.style.color = '#00ff87';

      renderPromos(data.promotions);
    });

    socket.on('promoStateUpdated', () => {
      requestLocation(); // Refresh promos dynamically when cashier toggles availability
    });

    function renderPromos(promos) {
      const container = document.getElementById('promosContainer');
      container.innerHTML = '';

      if (!promos || promos.length === 0) {
        container.innerHTML = '<p style="color: #888;">No active deals available right now.</p>';
        return;
      }

      promos.forEach((p) => {
        const exp = new Date(p.expires_at).toLocaleDateString();
        container.innerHTML += `
         <div class="promo-card">
            <div class="discount-tag">${p.discount_text}</div>
            <div class="promo-title">${p.title}</div>
            <div class="exp-date">Expires: ${exp}</div>
            <a class="btn-wallet" href="/api/wallet/google/${p.code}">
              📲 Save ${p.code} to Google Wallet
            </a>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
