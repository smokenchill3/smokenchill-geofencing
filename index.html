<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke N Chill - Store Offers & Notices</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0b0d12;
      --card-bg: #181b24;
      --border-color: #2a2e3d;
      --accent-green: #00e676;
      --accent-purple: #7c4dff;
      --danger-red: #ff5252;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent-green);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Live Toast Notification Banner */
    #liveNotification {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111b27;
      border: 2px solid var(--accent-green);
      color: #fff;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 1000;
      text-align: center;
      width: 90%;
      max-width: 450px;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .announcements-container {
      margin-bottom: 24px;
    }

    .announcement-card {
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .announcement-emergency {
      background: linear-gradient(135deg, #d50000, #ff1744);
      border: 1px solid #ff5252;
      color: #fff;
    }

    .announcement-info {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border-color);
      color: #fff;
    }

    .announcement-upcoming {
      background: linear-gradient(135deg, #4a148c, #7b1fa2);
      border: 1px solid var(--accent-purple);
      color: #fff;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .deal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative;
      transition: opacity 0.3s ease;
    }

    .deal-card.locked {
      opacity: 0.6;
      border-color: rgba(255, 82, 82, 0.4);
    }

    .deal-badge {
      display: inline-block;
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-green);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .badge-locked {
      background: rgba(255, 82, 82, 0.2);
      color: var(--danger-red);
      border: 1px solid var(--danger-red);
    }

    .deal-code {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .deal-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .qr-container {
      background: #ffffff;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: inline-block;
    }

    .qr-container img {
      display: block;
      width: 140px;
      height: 140px;
    }

    .wallet-btn {
      display: inline-block;
      transition: transform 0.15s ease;
    }

    .wallet-btn:hover {
      transform: scale(1.03);
    }

    .wallet-btn img {
      height: 42px;
    }
  </style>
</head>
<body>

  <!-- Real-Time Notification Banner for Customer -->
  <div id="liveNotification">
    <strong id="notifTitle" style="font-size: 1.1rem; color: var(--accent-green);">Notice</strong>
    <p id="notifBody" style="font-size: 0.9rem; margin-top: 4px; color: #cbd5e1;"></p>
  </div>

  <header>
    <h1>Smoke N Chill</h1>
    <p>Live Store Updates & Customer Promotions</p>
  </header>

  <!-- Emergency Notices & Newsletters -->
  <div id="customerAnnouncements" class="announcements-container"></div>

  <!-- Active Store Deals -->
  <div class="section-title">🏷️ Active Store Offers</div>
  <div id="customerDeals" class="deals-grid"></div>

  <script>
    const socket = io();

    document.addEventListener('DOMContentLoaded', () => {
      loadAnnouncements();
      loadDeals();
    });

    socket.on('announcementsUpdated', loadAnnouncements);
    socket.on('promoStateUpdated', loadDeals);

    // Listen for live coupon redemption event
    socket.on('couponRedeemed', (data) => {
      showNotification(
        '🎉 Coupon Redeemed!',
        `Code "${data.couponCode}" was redeemed. 24-hour limit active.`
      );
      loadDeals(); // Refresh deal cards to display locked status
    });

    function showNotification(title, message) {
      const banner = document.getElementById('liveNotification');
      document.getElementById('notifTitle').textContent = title;
      document.getElementById('notifBody').textContent = message;
      banner.style.display = 'block';

      setTimeout(() => {
        banner.style.display = 'none';
      }, 5000);
    }

    async function loadAnnouncements() {
      try {
        const res = await fetch('/api/announcements');
        const data = await res.json();
        const container = document.getElementById('customerAnnouncements');

        if (!data.success || data.announcements.length === 0) {
          container.innerHTML = '';
          return;
        }

        container.innerHTML = data.announcements.map(item => {
          let styleClass = 'announcement-info';
          let icon = '📢';

          if (item.type === 'emergency') {
            styleClass = 'announcement-emergency';
            icon = '🚨';
          } else if (item.type === 'upcoming') {
            styleClass = 'announcement-upcoming';
            icon = '🎉';
          }

          return `
            <div class="announcement-card ${styleClass}">
              <h3>${icon} ${item.title}</h3>
              <p>${item.message}</p>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to fetch announcements:', err);
      }
    }

    async function checkCouponStatus(code) {
      try {
        const res = await fetch(`/api/coupon-status?code=${encodeURIComponent(code)}`);
        return await res.json();
      } catch (err) {
        return { redeemed: false };
      }
    }

    async function loadDeals() {
      try {
        const res = await fetch('/api/promotions/all');
        const data = await res.json();
        const container = document.getElementById('customerDeals');

        if (!data.success || data.promotions.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No active offers at this time.</p>';
          return;
        }

        const activePromos = data.promotions.filter(p => p.is_active);

        if (activePromos.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted);">No active offers at this time.</p>';
          return;
        }

        const cardsHtml = await Promise.all(activePromos.map(async (promo) => {
          const status = await checkCouponStatus(promo.code);
          const isRedeemed = status.redeemed;

          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(promo.code)}&size=150x150`;
          const walletUrl = `/api/wallet/google/${encodeURIComponent(promo.code)}`;

          if (isRedeemed) {
            const unlockTime = new Date(status.unlocks_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
              <div class="deal-card locked">
                <div>
                  <div class="deal-badge badge-locked">🔒 REDEEMED TODAY</div>
                  <div class="deal-code">${promo.code}</div>
                  <div class="deal-title" style="color: var(--danger-red);">Unlocks tomorrow at ${unlockTime}</div>
                </div>

                <div class="qr-container" style="opacity: 0.3;">
                  <img src="${qrUrl}" alt="QR Code for ${promo.code}">
                </div>

                <p style="font-size: 0.75rem; color: var(--text-muted);">1 redemption allowed per 24 hours.</p>
              </div>
            `;
          }

          return `
            <div class="deal-card">
              <div>
                <div class="deal-badge">${promo.discount_text}</div>
                <div class="deal-code">${promo.code}</div>
                <div class="deal-title">${promo.title}</div>
              </div>

              <div class="qr-container">
                <img src="${qrUrl}" alt="QR Code for ${promo.code}">
              </div>

              <a href="${walletUrl}" target="_blank" class="wallet-btn">
                <img src="https://pay.google.com/gp/v/static/images/badges/en_US_add_to_google_wallet_wallet.svg" alt="Add to Google Wallet">
              </a>
            </div>
          `;
        }));

        container.innerHTML = cardsHtml.join('');
      } catch (err) {
        console.error('Failed to fetch deals:', err);
      }
    }
  </script>
</body>
</html>
