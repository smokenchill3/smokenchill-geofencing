<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smoke N Chill - Register & Admin Terminal</title>
  <style>
    body {
      background-color: #0d0d12;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #222;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .brand img { 
      width: 50px; 
      height: 50px;
      object-fit: contain;
    }
    
    .user-badge {
      background: #181824;
      border: 1px solid #2a2a3d;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-badge span { color: #00ff87; font-weight: bold; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .full-width { grid-column: 1 / -1; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    
    .panel {
      background: #181824;
      border: 1px solid #2a2a3d;
      border-radius: 12px;
      padding: 20px;
      position: relative;
    }
    .panel-locked {
      opacity: 0.5;
      pointer-events: none;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"], input[type="datetime-local"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #09090e;
      color: #00ff87;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: 2px solid #00ff87;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #00ff87;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #00e077; }
    .btn-secondary {
      background: #2a2a3d;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #3a3a52; }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      display: none;
    }
    .alert-success { background: rgba(0,255,135,0.2); border: 2px solid #00ff87; color: #00ff87; }
    .alert-error { background: rgba(255,71,87,0.2); border: 2px solid #ff4757; color: #ff4757; }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a3d;
    }
    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toggle-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-on { background: #00ff87; color: #000; }
    .btn-off { background: #ff4757; color: #fff; }

      background: rgba(255, 71, 87, 0.2);
      border: 1px solid #ff4757;
      color: #ff475
